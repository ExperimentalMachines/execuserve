# The same gate as `./gradlew verify`, plus the iOS compilation (macOS only) and the browser
# chat's checks against the scripted dev server.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The version code is the commit count, which a shallow clone gets wrong.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform and NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "ndk;29.0.14206865" > /dev/null
      - name: Lint, static analysis, tests and builds
        run: ./gradlew verify --continue
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

  ios:
    # Kotlin/Native's iOS targets compile only on macOS; Linux skips them.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # The version code is the commit count, which a shallow clone gets wrong.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared modules for iOS
        run: ./gradlew compileKotlinIosSimulatorArm64 compileKotlinIosArm64

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The version code is the commit count, which a shallow clone gets wrong.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/web/package-lock.json
      - name: Dev server
        run: |
          ./gradlew :jvm:devserver:installDist
          jvm/devserver/build/install/execuserve-dev/bin/execuserve-dev --port 8082 --key sk-dev &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8082/health && break; sleep 1; done
      - name: Browser chat checks
        working-directory: tools/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node browser-check.mjs
